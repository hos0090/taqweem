<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة بطاقات التقويم</title>
<script>/* اللوحة انتقلت لعنوانها الخاص: نمسح دخول المدير من هالعنوان المشترك ونحوّل */
try{localStorage.removeItem('tq_admin')}catch(e){}
try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){if(/\/admin\/$/.test(r.scope))r.unregister()})})}catch(e){}
location.replace('https://taqweem-app.github.io/admin/');</script></head>
<body style="font-family:system-ui;text-align:center;padding:40px">اللوحة انتقلت: <a href="https://taqweem-app.github.io/admin/">taqweem-app.github.io/admin</a></body></html>
